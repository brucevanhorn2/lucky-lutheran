# ============================================================================
# RETIRED 2026-08-02. This office is no longer built. It was replaced by
# luckylutheran/templates/evening-suffrages.yaml — the Evening Suffrages of
# the Common Service Book (1917), a genuinely Lutheran brief evening office.
#
# Why it was retired: roughly half of it was Anglican. The opening versicle,
# both collects, the benediction and the Nunc Dimittis antiphon all came from
# the 1928 English Deposited Book, because no Lutheran book of the period
# contains a Compline office at all. That borrowing was defensible on its own
# terms — the underlying prayers are ancient and public domain — but this
# project's whole claim is that every word is cited to a Lutheran or
# pre-Reformation source, and a borrowed office is the first thing an informed
# critic would find.
#
# It is kept, not deleted, because the verification work in it is real and
# worth preserving. Two pieces in particular:
#
#   - The Confession is Lutheran and verified word-for-word against the 1881
#     Missouri Synod Church Liturgy. It could be carried into the Evening
#     Suffrages if a confession is ever wanted there. The Anglican collects
#     could not.
#   - The reasoning about the absolution — why a layman and a recording must
#     use the precatory form, not the declarative — is the principle the whole
#     project runs on, and is restated in SOURCES.md and the README.
#
# Do not build from this file. See docs/replace-compline-with-evening-
# suffrages.md for the full account.
# ============================================================================
#
# The Order of Compline — prayer at the close of the day.
#
# No American Lutheran hymnal before TLH (1941) contains a Compline office —
# confirmed absent from the 1868/1893 "Church Book" (General Council), the
# 1917/1918 Common Service Book, and the 1881 Missouri Synod Church Liturgy
# (all three checked directly; none has a "Compline" section). TLH (1941)
# itself is not PD and was not consulted. So this order, unlike
# Matins/Vespers, has no single verified Lutheran predecessor text — it is
# assembled from pieces of the ancient Western monastic Compline (pre-1200s
# Latin origin, so the underlying prayers are themselves ancient/PD) as
# commonly rendered into English since the 19th century. Where a piece is
# shared with Matins/Vespers (Nunc Dimittis, Lord's Prayer, Kyrie, "Our
# help is in the name of the Lord") it carries the same verification as
# those offices — see their headers.
#
# Two Compline-specific sources have since been found and are cited inline:
#   - the confession, from the 1881 Missouri Synod Church Liturgy;
#   - the two collects and the closing benediction, from the Order for
#     Compline in the 1928 English Deposited Book (a complete Compline
#     office in a public-domain book, which no Lutheran service book of the
#     period provides).
# Still flagged !! VERIFY, all minor: the opening versicle (a conflation of
# two PD texts rather than a quotation of either), the Nunc Dimittis
# antiphon's opening clause, the absolution, and the bidding before the
# confession. Compline remains the least-verified office, but its substance
# is now sourced.

office: compline
title: Compline
tagline: "Prayer at the close of the day"

sections:
  - id: greeting
    title: Welcome
    lines:
      - speaker: liturgist
        text: >-
          {greeting} This is Compline, prayer at the close of the day, for
          {date_spoken}. Before we sleep, let us commit ourselves, one
          another, and our whole life to Christ our God.
    pause_after: 2.0

  # !! VERIFY: this line is a conflation of two separate texts, both of
  # which ARE public-domain-attested, but which no single source joins.
  # The 1928 Deposited Book's Compline opens: "The Lord Almighty grant us a
  # quiet night and A PERFECT END. Amen." The phrase "peace at the last"
  # occurs elsewhere in that same book, in Newman's evening prayer ("O Lord,
  # support us all the day long of this troublous life... grant us safe
  # lodging, a holy rest, and peace at the last"). So there is no copyright
  # concern here — both halves are PD — but as printed this quotes nothing
  # verbatim. To make it citable, change "peace at the last" to "a perfect
  # end" and it matches the 1928 Compline exactly. Left as-is pending a
  # decision, since this is a wording preference, not a rights problem.
  - id: opening
    title: Opening
    lines:
      - speaker: liturgist
        text: >-
          The Lord Almighty grant us a quiet night and peace at the last.
      - {speaker: congregation, text: "Amen."}
      - {speaker: liturgist, text: "Our help is in the name of the Lord."}
      - {speaker: congregation, text: "Who made heaven and earth."}
    pause_after: 1.5

  # VERIFIED: the confession below is transcribed word-for-word from
  # "Church Liturgy for Evangelical Lutheran Congregations of the Unaltered
  # Augsburg Confession" (Evangelical Lutheran Synod of Missouri, Concordia
  # Publishing House, 1881), archive.org item `churchliturgyfor00evan`,
  # unrestricted scan. Pre-1930 US publication, so automatically public
  # domain. The text appears twice in that book, identically: as the
  # general confession after the sermon in the Morning Service, and in the
  # Communion of the Sick. This is the Saxon confession recorded in
  # 16th-century Dresden practice (Sehling I:557) and is the direct
  # ancestor of the TLH p.15 wording — so we now cite the PD original
  # rather than the copyrighted 1941 reprint of it.
  #
  # Note this restores two clauses the earlier from-memory version had
  # dropped ("and justly deserved Thy punishment in time and eternity" /
  # "but I am heartily sorry for them and greatly repent of them"), and
  # corrects "of Thy boundless mercy" -> "by Thy boundless mercy" and
  # "sufferings" -> "suffering" (singular in the source).
  #
  # !! VERIFY: the liturgist's bidding and the absolution are NOT from the
  # 1881 book. Its bidding is sermon-specific ("Having heard the word of
  # God...") and so does not fit Compline, where confession precedes the
  # reading; its absolution is the declarative ministerial form ("I, by
  # virtue of my office, as a called and ordained servant of the Word...
  # I forgive you all your sins"), which presupposes a call from the church
  # (AC XIV) and so is doubly unavailable here — this is a household office
  # led by a layman, and it is besides a recording. See the README's
  # household-office section for the principle. The
  # precatory form kept below is the ancient Compline absolution (the
  # ~Indulgentiam~), but no pre-1930 English scan of it has been located.
  - id: confession
    title: Confession
    lines:
      - speaker: liturgist
        text: >-
          Let us confess our sins to God, our Father, asking Him in the name
          of our Lord Jesus Christ to forgive us.
      - speaker: all
        text: >-
          O almighty God, merciful Father, I, a poor, miserable sinner,
          confess unto Thee all my sins and iniquities with which I have ever
          offended Thee and justly deserved Thy punishment in time and
          eternity; but I am heartily sorry for them and greatly repent of
          them, and I pray Thee by Thy boundless mercy, and by the holy,
          innocent, bitter suffering and death of Thy beloved Son, Jesus
          Christ, to be gracious and merciful to me, a poor sinful being.
          Amen.
      - speaker: liturgist
        text: >-
          The almighty and merciful Lord grant us pardon, forgiveness, and
          remission of all our sins.
      - {speaker: congregation, text: "Amen."}
    pause_after: 2.0

  - id: psalm
    title: Psalmody
    slot: psalm
    pause_after: 2.0

  - id: hymn
    title: Office Hymn
    slot: hymn
    pause_after: 2.0

  - id: reading
    title: The Reading
    slot: reading
    pause_after: 1.5

  - id: versicles
    title: Versicles
    lines:
      - speaker: liturgist
        text: "Into Thy hands, O Lord, I commend my spirit."
      - speaker: congregation
        text: "For Thou hast redeemed me, O Lord, Thou God of truth."
      - {speaker: liturgist, text: "Keep me as the apple of the eye."}
      - {speaker: congregation, text: "Hide me under the shadow of Thy wings."}
    pause_after: 1.5

  # The canticle itself is verified (shared with Vespers — see that file).
  # !! VERIFY: the surrounding antiphon is not. The 1928 Deposited Book's
  # Compline prints it as "Preserve us, O Lord, while waking, and guard us
  # while sleeping, that awake we may watch with Christ, and asleep we may
  # rest in peace" — the second half matches ours word for word, but its
  # opening is "Preserve us... while waking", not "Guide us waking". The
  # "Guide us waking" recension is the one in common modern use; no
  # pre-1930 printing of it has been located. Switching to the 1928 opening
  # would make the whole antiphon citable from the same source as the
  # collects below.
  - id: nunc_dimittis
    title: "The Nunc Dimittis — the Song of Simeon"
    lines:
      - speaker: liturgist
        text: >-
          Guide us waking, O Lord, and guard us sleeping, that awake we may
          watch with Christ and asleep we may rest in peace.
      - speaker: all
        text: >-
          Lord, now lettest Thou Thy servant depart in peace: according to
          Thy word; for mine eyes have seen Thy salvation, which Thou hast
          prepared before the face of all people: a light to lighten the
          Gentiles and the glory of Thy people Israel. Glory be to the Father
          and to the Son: and to the Holy Ghost; as it was in the beginning,
          is now, and ever shall be: world without end. Amen.
      - speaker: liturgist
        text: >-
          Guide us waking, O Lord, and guard us sleeping, that awake we may
          watch with Christ and asleep we may rest in peace.
    pause_after: 2.0

  # !! VERIFY: the 1912 ELHB's own Vespers order doubles every Kyrie line
  # ("Lord, have mercy... Lord, have mercy...", etc.) rather than saying
  # each once as here. Unconfirmed which form is right for Compline.
  - id: kyrie
    title: The Kyrie
    lines:
      - speaker: all
        text: >-
          Lord, have mercy upon us. Christ, have mercy upon us. Lord, have
          mercy upon us.
    pause_after: 1.0

  - id: lords_prayer
    title: The Lord's Prayer
    lines:
      - speaker: all
        text: >-
          Our Father who art in heaven, hallowed be Thy name; Thy kingdom
          come; Thy will be done on earth as it is in heaven; give us this
          day our daily bread; and forgive us our trespasses, as we forgive
          those who trespass against us; and lead us not into temptation, but
          deliver us from evil. For Thine is the kingdom and the power and
          the glory forever and ever. Amen.
    pause_after: 1.5

  # VERIFIED: both collects are transcribed word-for-word from the Order
  # for Compline in "The Book of Common Prayer with the Additions and
  # Deviations Proposed in 1928" (the English "Deposited Book"),
  # archive.org item `bookofcommonpray00chur_20`, unrestricted scan
  # released under CC0. Published 1928, so public domain in the US on the
  # pre-1930 rule; the CC0 dedication on the scan removes any residual UK
  # Crown-copyright question, the same reasoning already applied to the KJV
  # (see SOURCES.md). This is the first Compline *office* located in any
  # public-domain book — the Lutheran service books checked (1868/1893
  # Church Book, 1917/18 Common Service Book, 1881 Missouri Synod Church
  # Liturgy) contain no Compline at all.
  #
  # Pronoun capitalization (Thee/Thy) is normalized to match the rest of
  # this file; the source prints them lowercase. No words changed.
  #
  # Corrections this makes to the earlier from-memory text:
  #   collect 1: "this place" (was "this habitation"), "drive from it all
  #     the snares" (was "drive far from it all snares"), "may Thy blessing"
  #     (was "let Thy blessing").
  #   collect 2: restored "silent" hours; "this fleeting world" (was "of
  #     life"); "repose upon" (was "rest in").
  # If "habitation" is preferred over "place", that variant is itself PD-
  # attested — St Dominic's Hymn-Book (1885), Office of Compline,
  # archive.org `StDominicsHymnBook` — but its surrounding clauses differ
  # ("to keep us in peace", "may thy blessing be always upon us"), so
  # taking the word alone would rebuild the hybrid this edit removed.
  - id: collects
    title: Prayers
    lines:
      - {speaker: liturgist, text: "Let us pray."}
      - speaker: liturgist
        text: >-
          Visit, we beseech Thee, O Lord, this place, and drive from it all
          the snares of the enemy; let Thy holy angels dwell herein to
          preserve us in peace; and may Thy blessing be upon us evermore;
          through Jesus Christ our Lord.
      - {speaker: congregation, text: "Amen."}
      - speaker: liturgist
        text: >-
          Be present, O merciful God, and protect us through the silent
          hours of this night, so that we who are wearied by the changes and
          chances of this fleeting world, may repose upon Thy eternal
          changelessness; through Jesus Christ our Lord.
      - {speaker: congregation, text: "Amen."}
    pause_after: 2.0

  # VERIFIED: exact match, word for word, with the closing blessing of the
  # 1928 Deposited Book's Order for Compline ("The Almighty and merciful
  # Lord, the Father, the Son, and the Holy Ghost, bless and preserve us.
  # Amen.") — same source as the collects above. No change needed.
  - id: benediction
    title: Benediction
    lines:
      - speaker: liturgist
        text: >-
          The almighty and merciful Lord, the Father, the Son, and the Holy
          Ghost, bless and preserve us.
      - {speaker: congregation, text: "Amen."}
    pause_after: 3.0
