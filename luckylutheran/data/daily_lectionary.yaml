# LSB Daily Lectionary — transcribed from the Lutheran Service Book
# (pew edition, Kindle), Daily Lectionary, pp. 299-304.
#
# A lectionary is a list of citations (facts, not copyrightable text).
#
# Two keying schemes, per the lectionary's own design:
#   movable:  keyed by days since Ash Wednesday ("ash+N"). Runs from Ash
#             Wednesday through the movable seasons (Lent/Easter, into the
#             Trinity transition).
#   days:     keyed "MM-DD" (civil calendar). Used following Holy Trinity
#             Sunday, continuing until the beginning of Lent.
#
# Per day: first (OT), second (NT), optional (italic third reading, covers
# material otherwise omitted — we skip it in the 10-minute office but keep
# it for show notes / a "long" edition).
#
# STILL TO TRANSCRIBE: the summer Time-of-the-Church stretch of `days`
# (after the Saturday following Pentecost until 11-26). In the Kindle
# edition that table is an unreadably small embedded image; it needs the
# print LSB or the lcms.org PDF. Those dates use the fallback plan.

