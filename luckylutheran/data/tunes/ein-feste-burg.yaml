  - [C#5, 1]
  - [B4, 1]
  - [A4, 1]
  - [B4, 0.5]
  - [A4, 0.5]
  - [G4, 0.5]
  - [F#4, 0.5]
  - [E4, 1]
  - [D4, 2]      # OURS: held 2 (Bach 1) — breath before the repeat

