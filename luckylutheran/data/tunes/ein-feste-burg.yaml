# EIN FESTE BURG — Martin Luther, 1529. Public domain.
# "A Mighty Fortress Is Our God" / "Ein feste Burg ist unser Gott".
#
# SOURCE: the soprano line of J. S. Bach's chorale harmonization BWV 80/8 —
# the closing chorale of Cantata BWV 80, which is itself named for this hymn —
# read out of the music21 Bach corpus rather than transcribed by ear. Checked
# against two further witnesses in the same corpus, BWV 302 and BWV 303. All
# three agree on pitch throughout and differ only in a few passing eighths;
# where they differ this file follows BWV 80/8.
#
# !! THIS IS THE ISOMETRIC ("smoothed") FORM, not Luther's original 1529
# rhythm. The 1529 tune is syncopated — the form printed at TLH 262 and
# LSB 656. Bach's era evened it out, and that evened form is what the
# American hymnals of the Common Service Book period print, so it is the
# period-correct choice for this project. The rhythmic form is a real
# alternative but would need its own source; do not reconstruct it by ear.
#
# Bar form (AAB): Stollen, Stollen repeated, Abgesang. Bach writes the
# Stollen once under a repeat sign; it is written out twice here.
#
# OURS, not from Bach: two note lengthenings for breath, both marked below —
# the Stollen-final D4 held 2 beats between repeats, and the closing D4 held
# 4. Everything else is the corpus reading.
#
# pitch: note name + octave (F#4 etc.); beats: quarter-note beats.

name: ein-feste-burg
title: EIN FESTE BURG
composer: Martin Luther, 1529 (harm. J. S. Bach)
key: D
tempo_qpm: 100
notes:
