  # --- Christian Questions with Their Answers ---------------------------
  # For self-examination before receiving the Sacrament. Grouped into
  # portions of a few Q&A pairs each rather than one per tiny question.
  # The Words of Institution portion is resolved from scripture (see
  # `reference` there), not hand-transcribed, for the same reason as the
  # Table of Duties above.

  - id: christian-questions-1
    title: "Christian Questions: Of Sin"
    text: >-
      Do you believe that you are a sinner? Yes, I believe it; I am a
      sinner.
    meaning: >-
      How do you know this? From the Ten Commandments, which I have not
      kept, as my conscience tells me.

  - id: christian-questions-2
    title: "Christian Questions: Of Sorrow and What Is Deserved"
    text: >-
      Are you sorry for your sins? Yes, I am sorry that I have sinned
      against God.
    meaning: >-
      What have you deserved from God because of your sins? His wrath and
      displeasure, temporal death, and eternal condemnation.

  - id: christian-questions-3
    title: "Christian Questions: Of Hope"
    text: >-
      Do you hope to be saved? Yes, that is my hope.
    meaning: >-
      In whom, then, do you trust? In my dear Lord Jesus Christ.

  - id: christian-questions-4
    title: "Christian Questions: Of Christ"
    text: >-
      Who is Christ? The Son of God, true God and man.
    meaning: >-
      How many gods are there? Only one; but there are three persons in the
      one Godhead: the Father, the Son, and the Holy Ghost.

  - id: christian-questions-5
    title: "Christian Questions: What Christ Has Done"
    text: >-
      What has Christ done for you that you trust in Him? He died for me
      and shed His blood for me on the cross for the forgiveness of sins.
    meaning: >-
      Did the Father also die for you? He is God only, not man; hence He
      could not die. But since Christ is true God and also true man, He
      died for me according to His human nature.

  - id: christian-questions-6
    title: "Christian Questions: The Words of Institution"
    reference: "1 Corinthians 11:23-25"
    citation: "First Corinthians, chapter eleven, verses twenty-three to twenty-five."
    meaning: >-
      How do you know this? From the holy Gospel, and from the words of
      Saint Paul, by which the Sacrament was instituted by Christ Himself.

  - id: christian-questions-7
    title: "Christian Questions: Believing the Sacrament"
    text: >-
      Do you believe, then, that the true body and blood of Christ are in
      the Sacrament? Yes, I believe it.
    meaning: >-
      What convinces you to believe this? The word of Christ: Take, eat;
      this is My body. Drink ye all of it; this is My blood.

  - id: christian-questions-8
    title: "Christian Questions: Remembering His Death"
    text: >-
      What should we do when we eat His body and drink His blood in the
      Sacrament? We should remember and proclaim His death and the
      shedding of His blood, as He taught us.
    meaning: >-
      Why should we remember and proclaim His death? That we may learn to
      believe that no creature could make satisfaction for our sins except
      Christ, true God and man; and that we may take to heart what a great
      thing it cost Him to redeem us from sin, death, and the power of the
      devil.

  - id: christian-questions-9
    title: "Christian Questions: Self-Examination"
    text: >-
      What should move a Christian to receive the Sacrament frequently?
      Both the command and the promise of Christ should move him, and also
      his own pressing need, on account of which the command, invitation,
      and promise are given.
    meaning: >-
      What ought those to consider who go carelessly and without any
      preparation? They should heed the warning of Saint Paul, that
      whosoever shall eat this bread and drink this cup of the Lord
      unworthily shall be guilty concerning the body and blood of the
      Lord.
