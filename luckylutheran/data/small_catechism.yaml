  # --- Christian Questions with Their Answers ---------------------------
  # For self-examination before receiving the Sacrament. Grouped into
  # portions of a few Q&A pairs each rather than one per tiny question.
  # The Words of Institution portion is resolved from scripture (see
  # `reference` there), not hand-transcribed, for the same reason as the
  # Table of Duties above.
  #
  # The eight hand-transcribed "Christian Questions" portions were REMOVED on
  # 2026-08-01. Their English was a modern CPH rendering — second person where
  # this repo is Thou throughout — and it added material absent from Luther's
  # German ("as my conscience tells me", "in the one Godhead", "according to
  # His human nature"). No pre-1930 English printing was found in the
  # Triglotta, the 1881 Missouri Synod Church Liturgy, the 1912 ELHB and its
  # 1905/1909 printings, Crull's 1879/1884 hymn books, or five pre-1930 English
  # Small Catechism editions. A public-domain GERMAN text does exist (1894
  # Bayerische Staatsbibliothek scan `11581004bsb`, corroborated by 1878
  # `drmartinluthersk0000mart`) if a fresh translation is ever wanted.
  #
  # The Questions are in any case an appendix, not a chief part: first printed
  # 1549, three years after Luther's death, attributed to him only from a 1551
  # edition, and the Triglotta does not print them at all. Their content
  # largely restates the Creed and Sacrament portions already in the rotation.
  # The Words of Institution below is kept — it resolves from scripture and
  # was never hand-transcribed.

  - id: christian-questions-6
    title: "Christian Questions: The Words of Institution"
    reference: "1 Corinthians 11:23-25"
