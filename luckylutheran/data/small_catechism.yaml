# Portions of Luther's Small Catechism for the daily devotion slot, rotated
# by day of year.
#
# VERIFIED (the 16 chief-part portions: all Ten Commandments, their Close,
# the three Creed articles, Baptism, and the Sacrament of the Altar):
# checked word for word against the English column of Concordia Triglotta
# (Concordia Publishing House, St. Louis, 1921), pp. 539-557, archive.org
# item `concordiatriglot00unse`, unrestricted scan. Pre-1930 US
# publication, so public domain. Ten of the sixteen were already correct;
# six carried wording that had drifted toward the familiar TLH (1943)
# English rather than the Triglotta's, and were corrected to the source:
#   cmdt 4  "serve, obey, and hold them" (was "serve and obey them, and")
#   cmdt 9  "craftily seek to get" (was "to gain")
#   cmdt 10 "anything that is his" (was "that is thy neighbor's");
#           "man-servant"/"maid-servant" hyphenated as in the source
#   close   "not act contrary to these commandments" (was "to them")
#   creed 1 substantially reworded — "limbs" (was "members"), "in addition
#           thereto" (was "also"), "house and homestead" (was "house and
#           home"), "provides me richly and daily", "protects me from all
#           danger, and guards me and preserves me from all evil", "out of
#           pure, fatherly", "for all which I owe it to Him to thank,
#           praise, serve, and obey Him"
#   creed 2 "in order that I may be His own"
#   creed 3 "one holy Christian Church" (was "the holy"); "He forgives
#           daily and richly", "at the last day will raise up", "will give
#           to me and to all believers... everlasting life" (was "eternal")
# Square-bracketed variants printed in the Triglotta are omitted here
# except in commandment 8, where the bracketed "[think and]" was already
# present and is retained.
#
# Do NOT swap in the 1986/1991 CPH translation ("You shall...") — that one
# is copyrighted.
#
# Table of Duties entries carry a `reference` (a Bible citation) instead of
# hand-transcribed `text`; catechism.py resolves those to real KJV text via
# scripture.get_passage — the same fetch-and-cache path the daily lectionary
# readings use — so no scripture text is hand-quoted from memory here.
#
# Covers: all Ten Commandments + their Close, the Creed, the whole of the
# Lord's Prayer (introduction, seven petitions, conclusion), one article
# each on Baptism and the Sacrament of the Altar, the full Table of Duties,
# and the Christian Questions with Their Answers — 48 portions, comfortably
# more than the 30 needed for a batch with no repeats. catechism.py indexes
# by day-of-year modulo len(portions), so the count is free to grow.
#
# STILL MISSING: the Confession / Office of the Keys chief part, and the
# remaining catechetical questions under Baptism and the Sacrament of the
# Altar (benefits, "how can water/eating do such things", etc.). Both are
# available in the same verified Triglotta English column — a good next
# batch.

portions:
  - id: commandment-1
    title: "The First Commandment"
    text: >-
      Thou shalt have no other gods.
    meaning: >-
      What does this mean? We should fear, love, and trust in God above all
      things.

  - id: commandment-2
    title: "The Second Commandment"
    text: >-
      Thou shalt not take the name of the Lord, thy God, in vain.
    meaning: >-
      What does this mean? We should fear and love God that we may not curse,
      swear, use witchcraft, lie, or deceive by His name, but call upon it in
      every trouble, pray, praise, and give thanks.

  - id: commandment-3
    title: "The Third Commandment"
    text: >-
      Thou shalt sanctify the holy day.
    meaning: >-
      What does this mean? We should fear and love God that we may not
      despise preaching and His Word, but hold it sacred and gladly hear and
      learn it.

  - id: commandment-4
    title: "The Fourth Commandment"
    text: >-
      Thou shalt honor thy father and thy mother, that it may be well with
      thee and thou mayest live long upon the earth.
    meaning: >-
      What does this mean? We should fear and love God that we may not
      despise nor anger our parents and masters, but give them honor, serve,
      obey, and hold them in love and esteem.

  - id: commandment-5
    title: "The Fifth Commandment"
    text: >-
      Thou shalt not kill.
    meaning: >-
      What does this mean? We should fear and love God that we may not hurt
      nor harm our neighbor in his body, but help and befriend him in every
      bodily need.

  - id: commandment-6
    title: "The Sixth Commandment"
    text: >-
      Thou shalt not commit adultery.
    meaning: >-
      What does this mean? We should fear and love God that we may lead a
      chaste and decent life in words and deeds, and each love and honor his
      spouse.

  - id: commandment-7
    title: "The Seventh Commandment"
    text: >-
      Thou shalt not steal.
    meaning: >-
      What does this mean? We should fear and love God that we may not take
      our neighbor's money or property, nor get them by false ware or
      dealing, but help him to improve and protect his property and
      business.

  - id: commandment-8
    title: "The Eighth Commandment"
    text: >-
      Thou shalt not bear false witness against thy neighbor.
    meaning: >-
      What does this mean? We should fear and love God that we may not
      deceitfully belie, betray, slander, or defame our neighbor, but defend
      him, think and speak well of him, and put the best construction on
      everything.

  - id: commandment-9
    title: "The Ninth Commandment"
    text: >-
      Thou shalt not covet thy neighbor's house.
    meaning: >-
      What does this mean? We should fear and love God that we may not
      craftily seek to get our neighbor's inheritance or house, and obtain
      it by a show of right, but help and be of service to him in keeping
      it.

  - id: commandment-10
    title: "The Tenth Commandment"
    text: >-
      Thou shalt not covet thy neighbor's wife, nor his man-servant, nor his
      maid-servant, nor his cattle, nor anything that is his.
    meaning: >-
      What does this mean? We should fear and love God that we may not
      estrange, force, or entice away our neighbor's wife, servants, or
      cattle, but urge them to stay and do their duty.

  - id: commandments-close
    title: "The Close of the Commandments"
    text: >-
      What does God say of all these commandments? He says thus: I, the
      Lord thy God, am a jealous God, visiting the iniquity of the fathers
      upon the children unto the third and fourth generation of them that
      hate Me, and showing mercy unto thousands of them that love Me and
      keep My commandments.
    meaning: >-
      What does this mean? God threatens to punish all that transgress
      these commandments. Therefore we should dread His wrath and not act
      contrary to these commandments. But He promises grace and every
      blessing to all that keep these commandments. Therefore we should also
      love and trust in Him, and gladly do according to His commandments.

  - id: creed-1
    title: "The First Article of the Creed: Of Creation"
    text: >-
      I believe in God the Father Almighty, Maker of heaven and earth.
    meaning: >-
      What does this mean? I believe that God has made me and all creatures;
      that He has given me my body and soul, eyes, ears, and all my limbs,
      my reason, and all my senses, and still preserves them; in addition
      thereto, clothing and shoes, meat and drink, house and homestead, wife
      and children, fields, cattle, and all my goods; that He provides me
      richly and daily with all that I need to support this body and life,
      protects me from all danger, and guards me and preserves me from all
      evil; and all this out of pure, fatherly, divine goodness and mercy,
      without any merit or worthiness in me; for all which I owe it to Him
      to thank, praise, serve, and obey Him. This is most certainly true.

  - id: creed-2
    title: "The Second Article of the Creed: Of Redemption"
    text: >-
      I believe in Jesus Christ, His only Son, our Lord, who was conceived by
      the Holy Ghost, born of the Virgin Mary, suffered under Pontius Pilate,
      was crucified, dead, and buried; He descended into hell; the third day
      He rose again from the dead; He ascended into heaven and sitteth on the
      right hand of God the Father Almighty; from thence He shall come to
      judge the quick and the dead.
    meaning: >-
      What does this mean? I believe that Jesus Christ, true God, begotten of
      the Father from eternity, and also true man, born of the Virgin Mary,
      is my Lord, who has redeemed me, a lost and condemned creature,
      purchased and won me from all sins, from death, and from the power of
      the devil, not with gold or silver, but with His holy, precious blood
      and with His innocent suffering and death, in order that I may be His
      own, and live under Him in His kingdom, and serve Him in everlasting
      righteousness, innocence, and blessedness, even as He is risen from the
      dead, lives and reigns to all eternity. This is most certainly true.

  - id: creed-3
    title: "The Third Article of the Creed: Of Sanctification"
    text: >-
      I believe in the Holy Ghost; one holy Christian Church, the communion
      of saints; the forgiveness of sins; the resurrection of the body; and
      the life everlasting. Amen.
    meaning: >-
      What does this mean? I believe that I cannot by my own reason or
      strength believe in Jesus Christ, my Lord, or come to Him; but the Holy
      Ghost has called me by the Gospel, enlightened me with His gifts,
      sanctified and kept me in the true faith; even as He calls, gathers,
      enlightens, and sanctifies the whole Christian Church on earth and
      keeps it with Jesus Christ in the one true faith; in which Christian
      Church He forgives daily and richly all sins to me and all believers,
      and at the last day will raise up me and all the dead, and will give
      to me and to all believers in Christ everlasting life. This is most
      certainly true.

  # --- The Third Chief Part: The Lord's Prayer -------------------------
  # VERIFIED: all nine portions below transcribed word for word from the
  # English column of Concordia Triglotta (CPH, 1921), "III. The Lord's
  # Prayer", pp. 545-549 — the same verified public-domain source as the
  # Commandments and Creed above. Square-bracketed variants printed in the
  # source are omitted. Placed here, between the Creed and Baptism, to
  # follow the catechism's own order of the chief parts.

  - id: lords-prayer-intro
    title: "The Lord's Prayer: The Introduction"
    text: >-
      Our Father who art in heaven.
    meaning: >-
      What does this mean? God would thereby tenderly urge us to believe
      that He is our true Father, and that we are His true children, so that
      we may ask Him confidently, with all assurance, as dear children ask
      their dear father.

  - id: lords-prayer-1
    title: "The Lord's Prayer: The First Petition"
    text: >-
      Hallowed be Thy name.
    meaning: >-
      What does this mean? God's name is indeed holy in itself; but we pray
      in this petition that it may become holy among us also. How is this
      done? When the Word of God is taught in its truth and purity, and we
      as the children of God also lead holy lives in accordance with it. To
      this end help us, dear Father in heaven. But he that teaches and lives
      otherwise than God's Word teaches profanes the name of God among us.
      From this preserve us, Heavenly Father.

  - id: lords-prayer-2
    title: "The Lord's Prayer: The Second Petition"
    text: >-
      Thy kingdom come.
    meaning: >-
      What does this mean? The kingdom of God comes indeed without our
      prayer, of itself; but we pray in this petition that it may come unto
      us also. How is this done? When our heavenly Father gives us His Holy
      Spirit, so that by His grace we believe His holy Word and lead a godly
      life here in time and yonder in eternity.

  - id: lords-prayer-3
    title: "The Lord's Prayer: The Third Petition"
    text: >-
      Thy will be done on earth as it is in heaven.
    meaning: >-
      What does this mean? The good and gracious will of God is done indeed
      without our prayer; but we pray in this petition that it may be done
      among us also. How is this done? When God breaks and hinders every
      evil counsel and will which would not let us hallow the name of God
      nor let His kingdom come, such as the will of the devil, the world,
      and our flesh; but strengthens and keeps us steadfast in His Word and
      in faith unto our end. This is His gracious and good will.

  - id: lords-prayer-4
    title: "The Lord's Prayer: The Fourth Petition"
    text: >-
      Give us this day our daily bread.
    meaning: >-
      What does this mean? God gives daily bread, even without our prayer,
      to all wicked men; but we pray in this petition that He would lead us
      to know it, and to receive our daily bread with thanksgiving. What is
      meant by daily bread? Everything that belongs to the support and wants
      of the body, such as meat, drink, clothing, shoes, house, homestead,
      field, cattle, money, goods, a pious spouse, pious children, pious
      servants, pious and faithful magistrates, good government, good
      weather, peace, health, discipline, honor, good friends, faithful
      neighbors, and the like.

  - id: lords-prayer-5
    title: "The Lord's Prayer: The Fifth Petition"
    text: >-
      And forgive us our trespasses, as we forgive those who trespass
      against us.
    meaning: >-
      What does this mean? We pray in this petition that our Father in
      heaven would not look upon our sins, nor deny such petitions on
      account of them; for we are worthy of none of the things for which we
      pray, neither have we deserved them; but that He would grant them all
      to us by grace; for we daily sin much, and indeed deserve nothing but
      punishment. So will we verily, on our part, also heartily forgive and
      also readily do good to those who sin against us.

  - id: lords-prayer-6
    title: "The Lord's Prayer: The Sixth Petition"
    text: >-
      And lead us not into temptation.
    meaning: >-
      What does this mean? God, indeed, tempts no one; but we pray in this
      petition that God would guard and keep us, so that the devil, the
      world, and our flesh may not deceive us, nor seduce us into misbelief,
      despair, and other great shame and vice; and though we be assailed by
      them, that still we may finally overcome and gain the victory.

  - id: lords-prayer-7
    title: "The Lord's Prayer: The Seventh Petition"
    text: >-
      But deliver us from evil.
    meaning: >-
      What does this mean? We pray in this petition, as in a summary, that
      our Father in heaven would deliver us from all manner of evil, of body
      and soul, property and honor, and at last, when our last hour shall
      come, grant us a blessed end, and graciously take us from this vale of
      tears to Himself into heaven.

  - id: lords-prayer-conclusion
    title: "The Lord's Prayer: The Conclusion"
    text: >-
      Amen.
    meaning: >-
      What does this mean? That I should be certain that these petitions are
      acceptable to our Father in heaven and heard; for He Himself has
      commanded us so to pray, and has promised that He will hear us. Amen,
      Amen; that is, Yea, yea, it shall be so.

  - id: baptism-1
    title: "The Sacrament of Holy Baptism: The Nature of Baptism"
    text: >-
      What is Baptism? Baptism is not simple water only, but it is the water
      comprehended in God's command and connected with God's Word.
    meaning: >-
      Which is that word of God? Christ, our Lord, says in the last chapter
      of Matthew: Go ye into all the world and teach all nations, baptizing
      them in the name of the Father and of the Son and of the Holy Ghost.

  - id: lords-supper-1
    title: "The Sacrament of the Altar: The Nature of the Sacrament"
    text: >-
      What is the Sacrament of the Altar? It is the true body and blood of
      our Lord Jesus Christ under the bread and wine, for us Christians to
      eat and to drink, instituted by Christ Himself.
    meaning: >-
      Where is this written? The holy Evangelists Matthew, Mark, Luke, and
      Saint Paul write thus: Our Lord Jesus Christ, the same night in which
      He was betrayed, took bread; and when He had given thanks, He brake it
      and gave it to His disciples and said, Take, eat; this is My body,
      which is given for you. This do in remembrance of Me.

