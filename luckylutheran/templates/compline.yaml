# The Order of Compline — prayer at the close of the day.
#
# No American Lutheran hymnal before TLH (1941) contains a Compline office —
# confirmed absent from the 1868/1893 "Church Book" (General Council), the
# 1917/1918 Common Service Book, and the 1881 Missouri Synod Church Liturgy
# (all three checked directly; none has a "Compline" section). TLH (1941)
# itself is not PD and was not consulted. So this order, unlike
# Matins/Vespers, has no single verified Lutheran predecessor text — it is
# assembled from pieces of the ancient Western monastic Compline (pre-1200s
# Latin origin, so the underlying prayers are themselves ancient/PD) as
# commonly rendered into English since the 19th century. Where a piece is
# shared with Matins/Vespers (Nunc Dimittis, Lord's Prayer, Kyrie, "Our
# help is in the name of the Lord") it carries the same verification as
# those offices — see their headers. The confession is now verified against
# a pre-1930 source of its own (1881; see its note below). The remaining
# Compline-specific pieces (opening versicle, the two closing collects, and
# the benediction) could NOT be matched against a specific pre-1930 raw
# source text; see inline !! VERIFY notes below. Compline is still the
# least-verified office, but no longer wholly unsourced.

office: compline
title: Compline
tagline: "Prayer at the close of the day"

sections:
  - id: greeting
    title: Welcome
    lines:
      - speaker: liturgist
        text: >-
          {greeting} This is Compline, prayer at the close of the day, for
          {date_spoken}. Before we sleep, let us commit ourselves, one
          another, and our whole life to Christ our God.
    pause_after: 2.0

  # !! VERIFY: "grant us a quiet night and peace at the last" is the
  # traditional English rendering of the ancient Compline versicle
  # ("Noctem quietam... concedat nobis Dominus omnipotens"), widely printed
  # in 19th-century Anglo-Catholic devotional manuals, but no specific
  # pre-1930 scan of this exact wording was located to cite directly.
  - id: opening
    title: Opening
    lines:
      - speaker: liturgist
        text: >-
          The Lord Almighty grant us a quiet night and peace at the last.
      - {speaker: congregation, text: "Amen."}
      - {speaker: liturgist, text: "Our help is in the name of the Lord."}
      - {speaker: congregation, text: "Who made heaven and earth."}
    pause_after: 1.5

  # VERIFIED: the confession below is transcribed word-for-word from
  # "Church Liturgy for Evangelical Lutheran Congregations of the Unaltered
  # Augsburg Confession" (Evangelical Lutheran Synod of Missouri, Concordia
  # Publishing House, 1881), archive.org item `churchliturgyfor00evan`,
  # unrestricted scan. Pre-1930 US publication, so automatically public
  # domain. The text appears twice in that book, identically: as the
  # general confession after the sermon in the Morning Service, and in the
  # Communion of the Sick. This is the Saxon confession recorded in
  # 16th-century Dresden practice (Sehling I:557) and is the direct
  # ancestor of the TLH p.15 wording — so we now cite the PD original
  # rather than the copyrighted 1941 reprint of it.
  #
  # Note this restores two clauses the earlier from-memory version had
  # dropped ("and justly deserved Thy punishment in time and eternity" /
  # "but I am heartily sorry for them and greatly repent of them"), and
  # corrects "of Thy boundless mercy" -> "by Thy boundless mercy" and
  # "sufferings" -> "suffering" (singular in the source).
  #
  # !! VERIFY: the liturgist's bidding and the absolution are NOT from the
  # 1881 book. Its bidding is sermon-specific ("Having heard the word of
  # God...") and so does not fit Compline, where confession precedes the
  # reading; its absolution is the declarative ministerial form ("I forgive
  # you all your sins"), which is inappropriate for a recorded voice. The
  # precatory form kept below is the ancient Compline absolution (the
  # ~Indulgentiam~), but no pre-1930 English scan of it has been located.
  - id: confession
    title: Confession
    lines:
      - speaker: liturgist
        text: >-
          Let us confess our sins to God, our Father, asking Him in the name
          of our Lord Jesus Christ to forgive us.
      - speaker: all
        text: >-
          O almighty God, merciful Father, I, a poor, miserable sinner,
          confess unto Thee all my sins and iniquities with which I have ever
          offended Thee and justly deserved Thy punishment in time and
          eternity; but I am heartily sorry for them and greatly repent of
          them, and I pray Thee by Thy boundless mercy, and by the holy,
          innocent, bitter suffering and death of Thy beloved Son, Jesus
          Christ, to be gracious and merciful to me, a poor sinful being.
          Amen.
      - speaker: liturgist
        text: >-
          The almighty and merciful Lord grant us pardon, forgiveness, and
          remission of all our sins.
      - {speaker: congregation, text: "Amen."}
    pause_after: 2.0

  - id: psalm
    title: Psalmody
    slot: psalm
    pause_after: 2.0

  - id: hymn
    title: Office Hymn
    slot: hymn
    pause_after: 2.0

  - id: reading
    title: The Reading
    slot: reading
    pause_after: 1.5

  - id: versicles
    title: Versicles
    lines:
      - speaker: liturgist
        text: "Into Thy hands, O Lord, I commend my spirit."
      - speaker: congregation
        text: "For Thou hast redeemed me, O Lord, Thou God of truth."
      - {speaker: liturgist, text: "Keep me as the apple of the eye."}
      - {speaker: congregation, text: "Hide me under the shadow of Thy wings."}
    pause_after: 1.5

  - id: nunc_dimittis
    title: "The Nunc Dimittis — the Song of Simeon"
    lines:
      - speaker: liturgist
        text: >-
          Guide us waking, O Lord, and guard us sleeping, that awake we may
          watch with Christ and asleep we may rest in peace.
      - speaker: all
        text: >-
          Lord, now lettest Thou Thy servant depart in peace: according to
          Thy word; for mine eyes have seen Thy salvation, which Thou hast
          prepared before the face of all people: a light to lighten the
          Gentiles and the glory of Thy people Israel. Glory be to the Father
          and to the Son: and to the Holy Ghost; as it was in the beginning,
          is now, and ever shall be: world without end. Amen.
      - speaker: liturgist
        text: >-
          Guide us waking, O Lord, and guard us sleeping, that awake we may
          watch with Christ and asleep we may rest in peace.
    pause_after: 2.0

  # !! VERIFY: the 1912 ELHB's own Vespers order doubles every Kyrie line
  # ("Lord, have mercy... Lord, have mercy...", etc.) rather than saying
  # each once as here. Unconfirmed which form is right for Compline.
  - id: kyrie
    title: The Kyrie
    lines:
      - speaker: all
        text: >-
          Lord, have mercy upon us. Christ, have mercy upon us. Lord, have
          mercy upon us.
    pause_after: 1.0

  - id: lords_prayer
    title: The Lord's Prayer
    lines:
      - speaker: all
        text: >-
          Our Father who art in heaven, hallowed be Thy name; Thy kingdom
          come; Thy will be done on earth as it is in heaven; give us this
          day our daily bread; and forgive us our trespasses, as we forgive
          those who trespass against us; and lead us not into temptation, but
          deliver us from evil. For Thine is the kingdom and the power and
          the glory forever and ever. Amen.
    pause_after: 1.5

  # !! VERIFY: "Visit, we beseech Thee..." and "Be present, O merciful
  # God..." are the traditional Western Compline collects (translating the
  # ancient "Visita, quaesumus, Domine" and its companion), reprinted in
  # many 19th-century PD devotional manuals, but no specific pre-1930 scan
  # of this exact English wording was located to cite directly in this
  # pass — not found in either the Common Service Book or the Church Book,
  # since neither contains a Compline office.
  - id: collects
    title: Prayers
    lines:
      - {speaker: liturgist, text: "Let us pray."}
      - speaker: liturgist
        text: >-
          Visit, we beseech Thee, O Lord, this habitation and drive far from
          it all snares of the enemy. Let Thy holy angels dwell herein to
          preserve us in peace, and let Thy blessing be upon us evermore;
          through Jesus Christ, our Lord.
      - {speaker: congregation, text: "Amen."}
      - speaker: liturgist
        text: >-
          Be present, O merciful God, and protect us through the hours of
          this night, so that we who are wearied by the changes and chances
          of life may rest in Thy eternal changelessness; through Jesus
          Christ, our Lord.
      - {speaker: congregation, text: "Amen."}
    pause_after: 2.0

  # !! VERIFY: this closing benediction is the traditional Compline
  # blessing form; not matched against a specific pre-1930 raw source in
  # this pass (see header note).
  - id: benediction
    title: Benediction
    lines:
      - speaker: liturgist
        text: >-
          The almighty and merciful Lord, the Father, the Son, and the Holy
          Ghost, bless and preserve us.
      - {speaker: congregation, text: "Amen."}
    pause_after: 3.0
