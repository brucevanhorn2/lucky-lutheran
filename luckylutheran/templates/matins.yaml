# The Order of Matins — after The Lutheran Hymnal (1941), p. 32. TLH
# reproduces the Common Service (1888) essentially unchanged for this
# office, and most of the text below (versicles, invitatory, Venite, Te
# Deum, salutation, Lord's Prayer, Benedicamus, Collect for Grace) has
# been verified word-for-word against two confirmed-public-domain
# predecessor editions: the Evangelical Lutheran Hymn-Book (Concordia
# Publishing House, 1912, via Project Wittenberg) and the Common Service
# Book of the Lutheran Church (1917/1918, via archive.org, unrestricted).
# Both are pre-1930 US publications (automatically PD). TLH (1941) itself
# was NOT directly consulted — only a copyright-restricted lending scan
# was found; citing the verified predecessor text instead.
#
# Responsory and Kyrie: both resolved 2026-08-02 against the local source
# mirrors and direct page reads of the 1917 CSB. See the inline notes and
# SOURCES.md. The Responsory's answer was CORRECTED in the process.
#
# Speakers: liturgist (officiant), congregation (responses), lector
# (readings), all (texts spoken together). Each speaker becomes a distinct
# TTS voice. `slot:` sections are filled by the assembler at build time.

office: matins
title: Matins
tagline: "The morning office of the Church"

sections:
  - id: greeting
    title: Welcome
    lines:
      - speaker: liturgist
        text: >-
          {greeting} This is Matins, the morning office of the Church, for
          {date_spoken}, {season_phrase}. Let us quiet our hearts and begin
          in the name of the Father and of the Son and of the Holy Ghost.
      - speaker: congregation
        text: "Amen."
    pause_after: 2.0

  - id: versicles
    title: Opening Versicles
    lines:
      - {speaker: liturgist, text: "O Lord, open Thou my lips."}
      - {speaker: congregation, text: "And my mouth shall show forth Thy praise."}
      - {speaker: liturgist, text: "Make haste, O God, to deliver me."}
      - {speaker: congregation, text: "Make haste to help me, O Lord."}
      - speaker: all
        text: >-
          Glory be to the Father and to the Son and to the Holy Ghost; as it
          was in the beginning, is now, and ever shall be, world without end.
          Amen. Hallelujah!
    pause_after: 1.5

  - id: invitatory
    title: Invitatory
    lines:
      - {speaker: liturgist, text: "Oh, come, let us worship the Lord."}
      - {speaker: congregation, text: "For He is our Maker."}
    pause_after: 1.0

  - id: venite
    title: "The Venite — Psalm 95"
    lines:
      - speaker: all
        text: >-
          Oh, come, let us sing unto the Lord: let us make a joyful noise to
          the Rock of our salvation. Let us come before His presence with
          thanksgiving: and make a joyful noise unto Him with psalms. For the
          Lord is a great God: and a great King above all gods. In His hand
          are the deep places of the earth: the strength of the hills is His
          also. The sea is His, and He made it: and His hands formed the dry
          land. Oh, come, let us worship and bow down: let us kneel before
          the Lord, our Maker. For He is our God: and we are the people of
          His pasture and the sheep of His hand. Glory be to the Father and
          to the Son: and to the Holy Ghost; as it was in the beginning, is
          now, and ever shall be: world without end. Amen.
    pause_after: 2.0

  - id: hymn
    title: Office Hymn
    slot: hymn
    pause_after: 2.0

  - id: psalm
    title: Psalmody
    slot: psalm
    pause_after: 2.0

  - id: reading
    title: The Lesson
    slot: reading
    pause_after: 1.0

  # VERIFIED 2026-08-02, and CORRECTED. The response used to read "Thanks be
  # to Thee, O Lord!" — which occurs NOWHERE in any book this project cites.
  # The ELHB of 1909 and 1893 both print "But Thou, O Lord, have mercy upon
  # us. / Answer. Thanks be to God."; the 1917 CSB prints "℣. O Lord, have
  # mercy upon us. ℟. Thanks be to God." (Vespers, p. 42, read off the page).
  # Zero hits for "Thanks be to Thee" in any of the three. The old line was
  # almost certainly TLH (1941) from memory — the one book we deliberately do
  # not consult. The versicle keeps the ELHB's "But Thou, O Lord"; only the
  # answer is corrected.
  - id: responsory
    title: Responsory
    lines:
      - {speaker: liturgist, text: "But Thou, O Lord, have mercy upon us."}
      - {speaker: congregation, text: "Thanks be to God."}
    pause_after: 2.0

  - id: devotion
    title: "Daily Catechism"
    slot: catechism
    pause_after: 2.0

  - id: te_deum
    title: "The Te Deum Laudamus"
    lines:
      - speaker: all
        text: >-
          We praise Thee, O God: we acknowledge Thee to be the Lord. All the
          earth doth worship Thee: the Father everlasting. To Thee all angels
          cry aloud: the heavens and all the powers therein. To Thee cherubim
          and seraphim continually do cry: Holy, holy, holy: Lord God of
          Sabaoth; heaven and earth are full of the majesty of Thy glory. The
          glorious company of the apostles praise Thee. The goodly fellowship
          of the prophets praise Thee. The noble army of martyrs praise Thee.
          The holy Church throughout all the world doth acknowledge Thee: the
          Father of an infinite majesty; Thine adorable, true, and only Son;
          also the Holy Ghost, the Comforter.
      - speaker: all
        text: >-
          Thou art the King of Glory, O Christ. Thou art the everlasting Son
          of the Father. When Thou tookest upon Thee to deliver man, Thou
          didst humble Thyself to be born of a virgin. When Thou hadst
          overcome the sharpness of death, Thou didst open the kingdom of
          heaven to all believers. Thou sittest at the right hand of God in
          the glory of the Father. We believe that Thou shalt come to be our
          Judge. We therefore pray Thee, help Thy servants, whom Thou hast
          redeemed with Thy precious blood. Make them to be numbered with Thy
          saints in glory everlasting.
      - speaker: all
        text: >-
          O Lord, save Thy people and bless Thine heritage. Govern them and
          lift them up forever. Day by day we magnify Thee. And we worship
          Thy name ever, world without end. Vouchsafe, O Lord, to keep us
          this day without sin. O Lord, have mercy upon us, have mercy upon
          us. O Lord, let Thy mercy be upon us, as our trust is in Thee. O
          Lord, in Thee have I trusted; let me never be confounded.
    pause_after: 2.0

  # !! VERIFY: the 1912 ELHB's Communion order says each Kyrie line once
  # (as here), but that same book's own Vespers order doubles every line
  # ("Lord, have mercy... Lord, have mercy...", etc.). Unconfirmed which
  # form TLH's Matins used.
  - id: kyrie
    title: The Kyrie
    lines:
      - speaker: all
        text: >-
          Lord, have mercy upon us. Christ, have mercy upon us. Lord, have
          mercy upon us.
    pause_after: 1.0

  - id: lords_prayer
    title: The Lord's Prayer
    lines:
      - speaker: all
        text: >-
          Our Father who art in heaven, hallowed be Thy name; Thy kingdom
          come; Thy will be done on earth as it is in heaven; give us this
          day our daily bread; and forgive us our trespasses, as we forgive
          those who trespass against us; and lead us not into temptation, but
          deliver us from evil. For Thine is the kingdom and the power and
          the glory forever and ever. Amen.
    pause_after: 1.5

  - id: salutation
    title: Salutation
    lines:
      - {speaker: liturgist, text: "The Lord be with you."}
      - {speaker: congregation, text: "And with thy spirit."}
      - {speaker: liturgist, text: "Let us pray."}
    pause_after: 2.0

  - id: collect_of_day
    title: Collect of the Day
    slot: collect_of_day
    pause_after: 1.5

  - id: collect_for_grace
    title: Collect for Grace
    lines:
      - speaker: liturgist
        text: >-
          O Lord, our heavenly Father, almighty and everlasting God, who hast
          safely brought us to the beginning of this day, defend us in the
          same with Thy mighty power and grant that this day we fall into no
          sin, neither run into any kind of danger, but that all our doings,
          being ordered by Thy governance, may be righteous in Thy sight;
          through Jesus Christ, Thy Son, our Lord, who liveth and reigneth
          with Thee and the Holy Ghost, ever one God, world without end.
      - {speaker: congregation, text: "Amen."}
    pause_after: 2.0

  # VERIFIED: checked word for word against the English column of Concordia
  # Triglotta (Concordia Publishing House, 1921), Small Catechism Appendix I
  # ("How the Head of the Family Should Teach His Household to Bless
  # Themselves Morning and Evening"), archive.org `concordiatriglot00unse`,
  # unrestricted scan, pre-1930 US publication. The earlier flag was right:
  # corrected to "I pray Thee to keep me" (was "that Thou wouldst keep me")
  # and "from sin and all evil" (was "every evil"); also "Heavenly Father"
  # and "Wicked Foe" capitalized as in the source.
  - id: luthers_morning_prayer
    title: "Luther's Morning Prayer"
    lines:
      - speaker: liturgist
        text: >-
          Let us give thanks unto God with the morning prayer of Doctor
          Luther.
      - speaker: all
        text: >-
          I thank Thee, my Heavenly Father, through Jesus Christ, Thy dear
          Son, that Thou hast kept me this night from all harm and danger;
          and I pray Thee to keep me this day also from sin and all evil,
          that all my doings and life may please Thee. For
          into Thy hands I commend myself, my body and soul, and all things.
          Let Thy holy angel be with me, that the Wicked Foe may have no
          power over me. Amen.
    pause_after: 2.0

  - id: benedicamus
    title: Benedicamus
    lines:
      - {speaker: liturgist, text: "Bless we the Lord."}
      - {speaker: congregation, text: "Thanks be to God."}
    pause_after: 1.0

  - id: benediction
    title: Benediction
    lines:
      - speaker: liturgist
        text: >-
          The grace of the Lord Jesus Christ, and the love of God, and the
          communion of the Holy Ghost be with you all.
      - {speaker: congregation, text: "Amen."}
    pause_after: 3.0
